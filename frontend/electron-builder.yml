# Desktop installers (TDD 2.2): npm run desktop:build. Build the backend first:
#   cd backend && pyinstaller backend.spec   -> backend/dist/triage-backend[.exe]
appId: studio.pinecone.pathology-triage
productName: Pathology Triage
copyright: MIT License
directories:
  output: release
  buildResources: build-resources
files:
  - dist-desktop/**
  - dist-electron/**
  - package.json
  # The renderer is already bundled by Vite; ship no node_modules.
  - "!node_modules/**"
extraResources:
  - from: ../backend/dist
    to: backend
    filter:
      - triage-backend
      - triage-backend.exe
asar: true
# No auto-update or crash reporting: the app never contacts the internet (TDD 7.1).
publish: null
mac:
  target: [dmg]
  category: public.app-category.medical
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Science
